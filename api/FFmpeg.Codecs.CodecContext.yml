  commentId: M:FFmpeg.Codecs.CodecContext.DrainEncoder
  id: DrainEncoder
  parent: FFmpeg.Codecs.CodecContext
  langs:
  - csharp
  - vb
  name: DrainEncoder()
  nameWithType: CodecContext.DrainEncoder()
  fullName: FFmpeg.Codecs.CodecContext.DrainEncoder()
