      branch: master
      repo: https://github.com/Pascal-Krenckel/FFmpeg.git
    id: DrainEncoder
    path: FFmpeg/Codecs/CodecContext.cs
    startLine: 1527
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Codecs
  summary: >-
    Enters draining mode for the encoder at the end of a stream, ensuring that any internally buffered packets are processed.

    This is required when no more input frames are available for encoding, but the codec may still have frames to output.
  remarks: >-
    The draining process for encoding works as follows:

    <ul><li>Instead of passing a valid frame, call <xref href="FFmpeg.Codecs.CodecContext.SendFrame(FFmpeg.Utils.AVFrame)" data-throw-if-not-resolved="false"></xref> with a <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> frame, which enters draining mode.</li><li>Then, call <xref href="FFmpeg.Codecs.CodecContext.ReceivePacket(FFmpeg.Utils.AVPacket)" data-throw-if-not-resolved="false"></xref> repeatedly to retrieve any remaining encoded packets until <code>AVERROR_EOF</code> is returned, 

    indicating that all buffered packets have been processed.</li><li>Before encoding can be resumed, call <xref href="FFmpeg.Codecs.CodecContext.FlushBuffers" data-throw-if-not-resolved="false"></xref> to clear the codec's internal buffers and reset its state.</li></ul>

    <p>During draining mode, <xref href="FFmpeg.Codecs.CodecContext.ReceivePacket(FFmpeg.Utils.AVPacket)" data-throw-if-not-resolved="false"></xref> will not return <code>AVERROR(EAGAIN)</code> unless the draining mode was not properly initiated.</p>
  example: []
  syntax:
    content: public AVResult32 DrainEncoder()
    return:
      type: FFmpeg.Utils.AVResult32
    content.vb: Public Function DrainEncoder() As AVResult32
  overload: FFmpeg.Codecs.CodecContext.DrainEncoder*
