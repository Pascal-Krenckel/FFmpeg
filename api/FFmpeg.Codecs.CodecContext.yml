    Enters draining mode for the decoder at the end of a stream, ensuring that any internally buffered frames are processed.

    This is required when no more input packets are available for decoding, but the codec may still have frames to output.
  remarks: >-
    The draining process for decoding works as follows:

    <ul><li>Instead of passing a valid packet, call <xref href="FFmpeg.Codecs.CodecContext.SendPacket(FFmpeg.Utils.AVPacket)" data-throw-if-not-resolved="false"></xref> with a <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> packet, which enters draining mode.</li><li>Then, call <xref href="FFmpeg.Codecs.CodecContext.ReceiveFrame(FFmpeg.Utils.AVFrame)" data-throw-if-not-resolved="false"></xref> repeatedly to retrieve any remaining decoded frames until <code>AVERROR_EOF</code> is returned, 

    indicating that all buffered frames have been processed.</li><li>Before decoding can be resumed, call <xref href="FFmpeg.Codecs.CodecContext.FlushBuffers" data-throw-if-not-resolved="false"></xref> to clear the codec's internal buffers and reset its state.</li></ul>

    <p>During draining mode, <xref href="FFmpeg.Codecs.CodecContext.ReceiveFrame(FFmpeg.Utils.AVFrame)" data-throw-if-not-resolved="false"></xref> will not return <code>AVERROR(EAGAIN)</code> unless the draining mode was not properly initiated.</p>
