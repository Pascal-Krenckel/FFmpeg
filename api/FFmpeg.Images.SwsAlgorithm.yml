  assemblies:
  - FFmpeg
  namespace: FFmpeg.Images
  summary: >-
    Creates a bicubic scaling algorithm with adjustable parameters.

    <p>

    For <xref href="FFmpeg.Images.SwsFlags.Bicubic" data-throw-if-not-resolved="false"></xref>, param1 tunes the value of f(1), and param2 tunes f'(1), which influence the shape of the basis function.

    </p>
  example: []
  syntax:
    content: public static SwsAlgorithm Bicubic(double param1 = 0, double param2 = 0.6)
    parameters:
    - id: param1
      type: System.Double
      description: 'Tuning parameter for f(1) (default: 0).'
    - id: param2
      type: System.Double
      description: "Tuning parameter for f'(1) (default: 0.6)."
    return:
      type: FFmpeg.Images.SwsAlgorithm
    content.vb: Public Shared Function Bicubic(param1 As Double = 0, param2 As Double = 0.6) As SwsAlgorithm
