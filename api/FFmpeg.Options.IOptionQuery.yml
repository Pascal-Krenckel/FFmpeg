.Dictionary%602" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Duration" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Options.OptionType.UInt64" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.UInt64" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.ImageSize" data-throw-if-not-resolved="false"></xref></td><td class="description">A tuple of <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> representing width and height.</td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.PixelFormat" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="FFmpeg.Images.PixelFormat" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.SampleFormat" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="FFmpeg.Audio.SampleFormat" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Bool" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.Boolean" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.ChannelLayout" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="FFmpeg.Audio.ChannelLayout" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.UInt32" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.UInt32" data-throw-if-not-resolved="false"></xref></td></tr></tbody></table>

