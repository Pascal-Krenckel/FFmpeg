  remarks: >-
    The method retrieves the option data as binary using the <xref href="FFmpeg.AutoGen.ffmpeg.av_opt_find2(System.Void*%2cSystem.String%2cSystem.String%2cSystem.Int32%2cSystem.Int32%2cSystem.Void**)" data-throw-if-not-resolved="false"></xref> and ffmpeg.av_opt_get_binary functions.

    The binary data is copied into the provided <xref href="System.Span%601" data-throw-if-not-resolved="false"></xref>. If the span is too small to accommodate the data, a negative value representing the required size is returned.

    In case of errors such as invalid option names, incorrect data types, or other failures, <xref href="System.Int32.MinValue" data-throw-if-not-resolved="false"></xref> is returned.

    To ensure the data is copied correctly, make sure the span is sufficiently sized based on the expected data size.
  example: []
  syntax:
    content: AVResult32 TryGetOption(Option option, Span<byte> value, bool recursive = true)
    parameters:
