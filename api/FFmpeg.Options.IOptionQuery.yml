    path: FFmpeg/Options/IOptionQuery.cs
    startLine: 113
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Options
  summary: Attempts to retrieve the width and height of an image option as a tuple from the AV-option-enabled class.
  remarks: >-
    The width and height are retrieved as a tuple using the <xref href="FFmpeg.AutoGen.ffmpeg.av_opt_get_image_size(System.Void*%2cSystem.String%2cSystem.Int32%2cSystem.Int32*%2cSystem.Int32*)" data-throw-if-not-resolved="false"></xref> function.

    This method is useful for quickly obtaining image dimensions as a single tuple value, which can simplify code that requires both width and height together.
  example: []
  syntax:
    content: AVResult32 TryGetOption(Option option, out (int Width, int Height) size, bool recursive = true)
    parameters:
    - id: option
      type: FFmpeg.Options.Option
      description: The <xref href="FFmpeg.Options.Option" data-throw-if-not-resolved="false"></xref> object representing the option whose value you want to retrieve.
    - id: size
      type: System.ValueTuple{System.Int32,System.Int32}
      description: When this method returns, contains a tuple with the width and height of the image option in pixels, or (0, 0) if the option is not found or if an error occurs.
    - id: recursive
      type: System.Boolean
      description: Specifies whether to search for the option recursively in child options.
    return:
      type: FFmpeg.Utils.AVResult32
      description: Returns an <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> indicating the result of the operation. Possible values include success or various error codes.
    content.vb: Function TryGetOption([option] As [Option], size As (Width As Integer, Height As Integer), recursive As Boolean = True) As AVResult32
