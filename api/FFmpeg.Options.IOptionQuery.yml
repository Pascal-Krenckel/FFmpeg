  summary: Attempts to retrieve the value of the specified <xref href="FFmpeg.Options.Option" data-throw-if-not-resolved="false"></xref> and convert it to an <xref href="System.Object" data-throw-if-not-resolved="false"></xref> of the appropriate type.
  remarks: >-
