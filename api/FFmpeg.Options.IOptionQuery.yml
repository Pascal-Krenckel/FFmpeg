    <table><thead><tr><th class="term">Option Type</th><th class="description">Returned Value Type</th></tr></thead><tbody><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Color" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Options.OptionType.Flags" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Options.OptionType.Int32" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.Int32" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Int64" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.Int64" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Constant" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Options.OptionType.Double" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Options.OptionType.Float" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.Double" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.String" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.String" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.VideoRate" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Options.OptionType.Rational" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="FFmpeg.Utils.Rational" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Binary" data-throw-if-not-resolved="false"></xref></td><td class="description">byte[]</td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Dictionary" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Duration" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Options.OptionType.UInt64" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.UInt64" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.ImageSize" data-throw-if-not-resolved="false"></xref></td><td class="description">A tuple of <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> representing width and height.</td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.PixelFormat" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="FFmpeg.Images.PixelFormat" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.SampleFormat" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="FFmpeg.Audio.SampleFormat" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.Bool" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.Boolean" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.ChannelLayout" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="FFmpeg.Audio.ChannelLayout" data-throw-if-not-resolved="false"></xref></td></tr><tr><td class="term"><xref href="FFmpeg.Options.OptionType.UInt32" data-throw-if-not-resolved="false"></xref></td><td class="description"><xref href="System.UInt32" data-throw-if-not-resolved="false"></xref></td></tr></tbody></table>

    <p>

    If the option type is not implemented or not supported, such as <xref href="FFmpeg.Options.OptionType.ChannelLayout" data-throw-if-not-resolved="false"></xref>, the method may return <xref href="FFmpeg.Utils.AVResult32.InvalidArgument" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: AVResult32 TryGetOption(Option option, out object? obj, bool recursive = true)
    parameters:
    - id: option
      type: FFmpeg.Options.Option
      description: The <xref href="FFmpeg.Options.Option" data-throw-if-not-resolved="false"></xref> object representing the option whose value you want to retrieve.
    - id: obj
      type: System.Object
      description: >-
        When this method returns, contains the value of the option as an <xref href="System.Object" data-throw-if-not-resolved="false"></xref> of the appropriate type. 

        The type of the object depends on the option's type, as described in the remarks. 

        If the option is not found or if an error occurs, this will be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    - id: recursive
      type: System.Boolean
      description: Specifies whether to search for the option recursively in child options.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        Returns an <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> indicating the result of the operation. 

        Possible values include:

        <ul><li><code>0</code> if the operation was successful and the value has been retrieved and converted to the appropriate type.</li><li><xref href="FFmpeg.Utils.AVResult32.InvalidArgument" data-throw-if-not-resolved="false"></xref> if the option type is not supported or if there is an issue with the arguments.</li></ul>
