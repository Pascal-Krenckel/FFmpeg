    path: FFmpeg/Options/IOptionQuery.cs
    startLine: 243
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Options
  summary: Attempts to retrieve an option and copy its binary data into a <xref href="System.Span%601" data-throw-if-not-resolved="false"></xref> from the AV-option-enabled class.
  remarks: >-
    The method retrieves the option data as binary using the <xref href="FFmpeg.AutoGen.ffmpeg.av_opt_find2(System.Void*%2cSystem.String%2cSystem.String%2cSystem.Int32%2cSystem.Int32%2cSystem.Void**)" data-throw-if-not-resolved="false"></xref> and ffmpeg.av_opt_get_binary functions.

    The binary data is copied into the provided <xref href="System.Span%601" data-throw-if-not-resolved="false"></xref>. If the span is too small to accommodate the data, a negative value representing the required size is returned.

    In case of errors such as invalid option names, incorrect data types, or other failures, <xref href="System.Int32.MinValue" data-throw-if-not-resolved="false"></xref> is returned.

    To ensure the data is copied correctly, make sure the span is sufficiently sized based on the expected data size.
  example: []
  syntax:
    content: AVResult32 TryGetOption(string name, Span<byte> value, bool recursive = true)
    parameters:
    - id: name
      type: System.String
      description: The name of the option to retrieve.
    - id: value
      type: System.Span{System.Byte}
      description: When this method returns, contains the data of the option copied into the provided <xref href="System.Span%601" data-throw-if-not-resolved="false"></xref>. If the span is not large enough to hold the data, the method returns a negative size indicating the required size.
    - id: recursive
      type: System.Boolean
      description: Specifies whether to search for the option recursively in child options.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        Returns the size of the data successfully copied into the <xref href="System.Span%601" data-throw-if-not-resolved="false"></xref> if the operation was successful.

        If the provided span is too small to hold the data, returns a negative value indicating the required size of the span.

        If the option is not found, the data type is incorrect, or any other error occurs, returns <xref href="System.Int32.MinValue" data-throw-if-not-resolved="false"></xref>.
    content.vb: Function TryGetOption(name As String, value As Span(Of Byte), recursive As Boolean = True) As AVResult32
