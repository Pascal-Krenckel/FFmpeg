    - id: value
      type: System.ReadOnlyMemory{System.Byte}
      description: When this method returns, contains the binary data of the option as a <xref href="System.ReadOnlyMemory%601" data-throw-if-not-resolved="false"></xref>. If the option is not found or if an error occurs, the memory will be empty.
    - id: recursive
      type: System.Boolean
      description: Specifies whether to search for the option recursively in child options.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        Returns an <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> indicating the result of the operation. 

        Possible values include:

        <ul><li>Zero (0) if the operation was successful and the binary data has been successfully copied into the <xref href="System.ReadOnlyMemory%601" data-throw-if-not-resolved="false"></xref>.</li><li><xref href="FFmpeg.Utils.AVResult32.OptionNotFound" data-throw-if-not-resolved="false"></xref> if the option could not be found or if the data type is incorrect.</li><li><xref href="FFmpeg.Utils.AVResult32.InvalidArgument" data-throw-if-not-resolved="false"></xref> if the data size is invalid or if any other argument-related issue occurs.</li></ul>
