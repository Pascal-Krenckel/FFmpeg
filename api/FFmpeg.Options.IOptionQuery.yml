  namespace: FFmpeg.Options
  summary: Attempts to retrieve an option and return its binary data as a <xref href="System.Byte" data-throw-if-not-resolved="false"></xref> array from the AV-option-enabled class.
  remarks: >-
    The method retrieves the option data as binary using the <xref href="FFmpeg.AutoGen.ffmpeg.av_opt_find2(System.Void*%2cSystem.String%2cSystem.String%2cSystem.Int32%2cSystem.Int32%2cSystem.Void**)" data-throw-if-not-resolved="false"></xref> function. 

    If the option contains binary data, it is copied into a new <xref href="System.Byte" data-throw-if-not-resolved="false"></xref> array. 

    If the option is not found or does not contain binary data, or if there is an issue with the size, appropriate error codes are returned:

    <ul><li><xref href="FFmpeg.Utils.AVResult32.OptionNotFound" data-throw-if-not-resolved="false"></xref> if the option is not found or the data type is not binary.</li><li><xref href="FFmpeg.Utils.AVResult32.InvalidArgument" data-throw-if-not-resolved="false"></xref> if the binary data size is too large or other issues occur.</li></ul>

    To ensure correct operation, handle errors based on the returned <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> code and validate the size of binary data if necessary.
  example: []
  syntax:
    content: AVResult32 TryGetOption(string name, out byte[] value, bool recursive = true)
    parameters:
    - id: name
      type: System.String
      description: The name of the option to retrieve.
    - id: value
      type: System.Byte[]
      description: When this method returns, contains the binary data of the option as a <xref href="System.Byte" data-throw-if-not-resolved="false"></xref> array. If the option is not found or if an error occurs, the array will be empty.
    - id: recursive
      type: System.Boolean
      description: Specifies whether to search for the option recursively in child options.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        Returns an <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> indicating the result of the operation. 

        Possible values include:

        <ul><li>Zero (0) if the operation was successful.</li><li><xref href="FFmpeg.Utils.AVResult32.OptionNotFound" data-throw-if-not-resolved="false"></xref> if the option could not be found or if the data type is incorrect.</li><li><xref href="FFmpeg.Utils.AVResult32.InvalidArgument" data-throw-if-not-resolved="false"></xref> if the data size is invalid or if any other argument-related issue occurs.</li></ul>
    content.vb: Function TryGetOption(name As String, value As Byte(), recursive As Boolean = True) As AVResult32
