  assemblies:
  - FFmpeg
  namespace: FFmpeg.Filters
  summary: Handy mask to test whether the filter supports timeline features (either generically or internally).
  example: []
  syntax:
    content: SupportTimeline = SupportTimelineGeneric | SupportTimelineInternal
    return:
      type: FFmpeg.Filters.FilterFlags
