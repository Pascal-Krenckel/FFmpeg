- uid: FFmpeg.Filters.FilterFlags.SupportTimelineInternal
  commentId: F:FFmpeg.Filters.FilterFlags.SupportTimelineInternal
  id: SupportTimelineInternal
  parent: FFmpeg.Filters.FilterFlags
  langs:
  - csharp
  - vb
  name: SupportTimelineInternal
  nameWithType: FilterFlags.SupportTimelineInternal
  fullName: FFmpeg.Filters.FilterFlags.SupportTimelineInternal
  type: Field
  source:
    remote:
      path: FFmpeg/Filters/FilterFlags.cs
      branch: master
      repo: https://github.com/Pascal-Krenckel/FFmpeg.git
    id: SupportTimelineInternal
    path: FFmpeg/Filters/FilterFlags.cs
    startLine: 48
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Filters
  summary: >-
    Same as SupportTimelineGeneric, except the filter will have its filter_frame() callback(s)

    called as usual, even when the enable expression is false. The filter itself will disable 

    filtering within the callback.
  example: []
  syntax:
    content: SupportTimelineInternal = 131072
    return:
      type: FFmpeg.Filters.FilterFlags
