    id: TryExecuteTaskInline
    path: FFmpeg/Threading/LimitedConcurrencyLevelTaskScheduler.cs
    startLine: 79
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Threading
  summary: Determines whether the provided <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> can be executed synchronously in this call, and if it can, executes it.
  example: []
  syntax:
    content: protected override sealed bool TryExecuteTaskInline(Task task, bool taskWasPreviouslyQueued)
    parameters:
    - id: task
      type: System.Threading.Tasks.Task
      description: The <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> to be executed.
    - id: taskWasPreviouslyQueued
      type: System.Boolean
      description: A Boolean denoting whether or not task has previously been queued. If this parameter is True, then the task may have been previously queued (scheduled); if False, then the task is known not to have been queued, and this call is being made in order to execute the task inline without queuing it.
    return:
      type: System.Boolean
      description: A Boolean value indicating whether the task was executed inline.
    content.vb: Protected NotOverridable Overrides Function TryExecuteTaskInline(task As Task, taskWasPreviouslyQueued As Boolean) As Boolean
  overridden: System.Threading.Tasks.TaskScheduler.TryExecuteTaskInline(System.Threading.Tasks.Task,System.Boolean)
  overload: FFmpeg.Threading.LimitedConcurrencyLevelTaskScheduler.TryExecuteTaskInline*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The <code class="paramref">task</code> argument is null.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: The <code class="paramref">task</code> was already executed.
