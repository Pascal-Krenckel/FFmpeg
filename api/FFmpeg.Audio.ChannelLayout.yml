    startLine: 13
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Audio
  summary: >-
    Represents a channel layout, which defines the arrangement of audio channels in a multi-channel audio format.

    This class provides functionality to interact with and manipulate audio channel layouts using FFmpeg's <xref href="FFmpeg.AutoGen._AVChannelLayout" data-throw-if-not-resolved="false"></xref> structure.
  remarks: >-
    A channel layout describes the number and arrangement of audio channels (e.g., stereo, 5.1 surround sound).

    The <xref href="FFmpeg.Audio.ChannelLayout" data-throw-if-not-resolved="false"></xref> class allows you to create, initialize, and manage channel layouts, and to retrieve standard layouts available in FFmpeg.

    It also supports copying and cloning of layouts, as well as conversion between planar and packed formats.
