    id: RescaleTS
    path: FFmpeg/Utils/AVPacket.cs
    startLine: 295
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Utils
  summary: >-
    Rescales the timing fields (timestamps and durations) of the current packet from its current time base to a new time base. <br />

    This operation modifies the packet's timing fields to express them in the new time base.
  remarks: >-
    If any of the packet's timestamps have unknown values (such as <xref href="FFmpeg.AutoGen.ffmpeg.AV_NOPTS_VALUE" data-throw-if-not-resolved="false"></xref>), they will be ignored during the conversion.

    The method also updates the packet's time base to the new time base after rescaling.
  example: []
  syntax:
    content: public void RescaleTS(Rational newTimeBase)
    parameters:
    - id: newTimeBase
      type: FFmpeg.Utils.Rational
      description: The destination time base to which the timing fields of the packet will be converted.
    content.vb: Public Sub RescaleTS(newTimeBase As Rational)
  overload: FFmpeg.Utils.AVPacket.RescaleTS*
