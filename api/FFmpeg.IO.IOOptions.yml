  namespace: FFmpeg.IO
  summary: >-
    Flags representing different input/output operations that can be performed on a stream or file.

    These flags can be combined using a bitwise OR, except for <xref href="FFmpeg.IO.IOOptions.Read" data-throw-if-not-resolved="false"></xref> and <xref href="FFmpeg.IO.IOOptions.Write" data-throw-if-not-resolved="false"></xref>, which are mutually exclusive.
