  assemblies:
  - FFmpeg
  namespace: FFmpeg.Images
  summary: >-
    Represents the color transfer characteristics, which define how color values are encoded and transformed.

    These values match the ones defined by ISO/IEC 23091-2_2019 subclause 8.2.
