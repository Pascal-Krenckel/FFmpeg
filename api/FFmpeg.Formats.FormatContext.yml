  remarks: >-
    This method opens the input using the specified <code class="paramref">stream</code> and <code class="paramref">input</code> format with <code class="paramref">url</code> set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>. 

