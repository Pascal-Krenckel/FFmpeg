  assemblies:
  - FFmpeg
  namespace: FFmpeg.Formats
  summary: Provides a managed wrapper around the native <xref href="FFmpeg.AutoGen._AVFormatContext" data-throw-if-not-resolved="false"></xref> structure from the FFmpeg library.
  remarks: >-
    The <xref href="FFmpeg.Formats.FormatContext" data-throw-if-not-resolved="false"></xref> class is a critical component in handling media streams with FFmpeg. It encapsulates the context used for handling input and output formats, including parsing and managing media files or streams.


    This class provides a managed interface to the native <xref href="FFmpeg.AutoGen._AVFormatContext" data-throw-if-not-resolved="false"></xref> pointer, offering functionalities for opening media streams, querying and modifying format options, and interacting with other FFmpeg components.


    <p>

    As a wrapper around a native pointer, this class implements <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> to ensure proper cleanup of unmanaged resources. You should always dispose of instances of this class when they are no longer needed to avoid memory leaks and potential crashes.

    </p>


    <p>

    The class also inherits from <xref href="FFmpeg.Options.OptionQueryBase" data-throw-if-not-resolved="false"></xref>, enabling access to FFmpeg's options querying and setting capabilities. This allows for configuring various aspects of media handling by setting or querying options on the format context.

    </p>
  example: []
  syntax:
    content: 'public sealed class FormatContext : OptionQueryBase, IOptionQuery, IDisposable'
