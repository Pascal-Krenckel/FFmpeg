    If a dictionary is provided as an <xref href="System.Collections.Generic.IDictionary%602" data-throw-if-not-resolved="false"></xref>, it will be converted to a <xref href="FFmpeg.Collections.AVDictionary" data-throw-if-not-resolved="false"></xref> internally. 

