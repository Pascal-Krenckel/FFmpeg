      branch: master
      repo: https://github.com/Pascal-Krenckel/FFmpeg.git
    id: OpenInput
    path: FFmpeg/Formats/FormatContext.cs
    startLine: 1145
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Formats
  summary: Opens an input media stream and initializes the <xref href="FFmpeg.Formats.FormatContext" data-throw-if-not-resolved="false"></xref> using the specified dictionary of options and <xref href="FFmpeg.IO.IOContext" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This method opens the input using the specified <code class="paramref">ioContext</code> and <code class="paramref">dic</code> with <code class="paramref">url</code> and <code class="paramref">input</code> set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>. 

    If <code class="paramref">dic</code> is an <xref href="System.Collections.Generic.IDictionary%602" data-throw-if-not-resolved="false"></xref> other than <xref href="FFmpeg.Collections.AVDictionary" data-throw-if-not-resolved="false"></xref> or <xref href="FFmpeg.Collections.AVMultiDictionary" data-throw-if-not-resolved="false"></xref>, it will be converted to a <xref href="FFmpeg.Collections.AVDictionary" data-throw-if-not-resolved="false"></xref> internally. 

    The <code class="paramref">ioContext</code> is used to initialize the <xref href="FFmpeg.Formats.FormatContext" data-throw-if-not-resolved="false"></xref> with read and write capabilities. 

    After opening the input, the <code class="paramref">findStreamInfo</code> flag determines if <xref href="FFmpeg.AutoGen.ffmpeg.avformat_find_stream_info(FFmpeg.AutoGen._AVFormatContext*%2cFFmpeg.AutoGen._AVDictionary**)" data-throw-if-not-resolved="false"></xref> will be called to find stream information.
  example: []
  syntax:
    content: public static FormatContext OpenInput(IOContext ioContext, IDictionary<string, string>? dic, bool findStreamInfo = false)
    parameters:
    - id: ioContext
      type: FFmpeg.IO.IOContext
      description: The <xref href="FFmpeg.IO.IOContext" data-throw-if-not-resolved="false"></xref> to handle I/O operations for the media stream. It is responsible for setting up reading and writing capabilities.
    - id: dic
      type: System.Collections.Generic.IDictionary{System.String,System.String}
      description: >-
        Optional. A dictionary of additional options for the input. This can be a <xref href="FFmpeg.Collections.AVDictionary" data-throw-if-not-resolved="false"></xref>, <xref href="FFmpeg.Collections.AVMultiDictionary" data-throw-if-not-resolved="false"></xref>, or a simple <xref href="System.Collections.Generic.IDictionary%602" data-throw-if-not-resolved="false"></xref>. 

        May be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    - id: findStreamInfo
      type: System.Boolean
      description: Optional. If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, will call <xref href="FFmpeg.AutoGen.ffmpeg.avformat_find_stream_info(FFmpeg.AutoGen._AVFormatContext*%2cFFmpeg.AutoGen._AVDictionary**)" data-throw-if-not-resolved="false"></xref> after opening the input to find stream information.
    return:
      type: FFmpeg.Formats.FormatContext
      description: An <xref href="FFmpeg.Formats.FormatContext" data-throw-if-not-resolved="false"></xref> initialized with the input media stream, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if the operation fails. Throws an <xref href="System.OutOfMemoryException" data-throw-if-not-resolved="false"></xref> if memory allocation fails.
    content.vb: Public Shared Function OpenInput(ioContext As IOContext, dic As IDictionary(Of String, String), findStreamInfo As Boolean = False) As FormatContext
