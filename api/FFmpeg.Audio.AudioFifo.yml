    parameters:
    - id: data
      type: System.Byte[]
      description: >-
        A byte array to receive interleaved audio samples.  

        The data layout depends on the audio <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref> and the number of <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref>.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of bytes successfully peeked (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
