  - FFmpeg
  namespace: FFmpeg.Audio
  summary: Writes audio data from an <xref href="FFmpeg.Utils.AVFrame" data-throw-if-not-resolved="false"></xref> into the <xref href="FFmpeg.Audio.AudioFifo" data-throw-if-not-resolved="false"></xref> buffer.
  remarks: >-
    <p>

    The <xref href="FFmpeg.Audio.AudioFifo" data-throw-if-not-resolved="false"></xref> stores all audio data according to the <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref> specified when the FIFO was created.  

    This method does not convert between sample types (e.g., float ↔ int16); doing so must be handled by the caller.

    </p>

    <p>

    Planar ↔ packed conversions are handled automatically:

    <ul><li>If the frame's format exactly matches the FIFO format, the data is written directly using <code>ffmpeg.av_audio_fifo_write</code>.</li><li>If the FIFO expects planar but the frame is packed, the data is converted from packed to planar using <xref href="FFmpeg.Audio.AudioFifo.WritePackedToPlanar(System.Byte*%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.</li><li>If the FIFO expects packed but the frame is planar, the data is converted from planar to packed using <xref href="FFmpeg.Audio.AudioFifo.WritePlanarToPacked(System.Byte**%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.</li></ul>

    </p>

    <p>

    To avoid unnecessary copying, it is recommended to provide frames in the same planar/packed layout as the FIFO’s <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: public AVResult32 Write(AVFrame frame)
    parameters:
    - id: frame
      type: FFmpeg.Utils.AVFrame
      description: >-
        The <xref href="FFmpeg.Utils.AVFrame" data-throw-if-not-resolved="false"></xref> containing audio samples to write.  

        The frame’s number of channels must match the FIFO’s <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref> property, 

        and the sample format must match the planar/packed layout of the FIFO's <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of samples successfully written to the FIFO (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
    content.vb: Public Function Write(frame As AVFrame) As AVResult32
  overload: FFmpeg.Audio.AudioFifo.Write*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      Thrown if the frame's channel count does not match the FIFO’s <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref>, 

      or if the frame's planar/packed layout does not match the FIFO's <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.
