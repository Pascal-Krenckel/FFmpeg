  assemblies:
  - FFmpeg
  namespace: FFmpeg.Audio
  summary: Represents a managed wrapper around FFmpeg's <code>AVAudioFifo</code> for audio buffering.
  remarks: >-
    <p>

    This class provides safe, high-level methods to write and read audio data into and from an underlying <code>AVAudioFifo</code> buffer.  

    It supports multiple input formats and channel configurations, and can handle packed ↔ planar (interleaved/unpacked) data internally.

    </p>

    <p>

    Important: <xref href="FFmpeg.Audio.AudioFifo" data-throw-if-not-resolved="false"></xref> does <b>not convert between sample formats</b> (for example, float ↔ int16).  

    The data is always stored internally according to the <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref> specified when the FIFO was created.

    </p>

    <p>

    To avoid unnecessary copying and conversion overhead, it is recommended to provide data in the same planar/packed layout as the FIFO’s <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.  

    If the input layout differs, the FIFO will perform planar ↔ packed conversions internally, which may allocate temporary buffers.

    </p>

    <p>

    The FIFO maintains an internal buffer for audio samples, allowing for flexible processing pipelines in multi-channel or multi-format audio applications.

    </p>
