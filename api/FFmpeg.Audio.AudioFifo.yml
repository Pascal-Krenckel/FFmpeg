    without advancing the current read position.
  remarks: >-
    This method reinterprets <code class="paramref">data</code> as a <xref href="System.Span%601" data-throw-if-not-resolved="false"></xref> and calls 

    <xref href="FFmpeg.Audio.AudioFifo.Peek(System.Span%7bSystem.Byte%7d%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> internally.  

    Like all Peek methods, it does not advance the internal read position.
  example: []
  syntax:
    content: 'public AVResult32 Peek<T>(T[] data, int offset) where T : unmanaged'
    parameters:
    - id: data
      type: '{T}[]'
      description: >-
        A writable buffer to receive interleaved audio samples for all channels.  

        Samples are packed: one sample per channel in sequence for each frame.
    - id: offset
      type: System.Int32
      description: >-
        The sample offset (in frames) from which to start peeking.  

        A value of <code>0</code> peeks from the beginning of the available buffered data.
    typeParameters:
    - id: T
      description: >-
        The unmanaged sample type (for example, <xref href="System.Single" data-throw-if-not-resolved="false"></xref> or <xref href="System.Int16" data-throw-if-not-resolved="false"></xref>).  

        The size of <code class="typeparamref">T</code> must match the sample size of the current audio <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.
    return:
