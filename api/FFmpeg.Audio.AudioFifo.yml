  namespace: FFmpeg.Audio
  summary: Peeks typed audio samples into a single buffer without advancing the read position.
  remarks: >-
    This method reinterprets <code class="paramref">data</code> as a <xref href="System.Span%601" data-throw-if-not-resolved="false"></xref> and calls 

    <xref href="FFmpeg.Audio.AudioFifo.Peek(System.Span%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> internally.  

    Like all Peek methods, it does not advance the internal read position.
  example: []
  syntax:
    content: 'public AVResult32 Peek<T>(T[] data) where T : unmanaged'
    parameters:
    - id: data
      type: '{T}[]'
      description: >-
        A buffer to receive interleaved audio samples for all channels.  

        Samples are packed: one sample per channel in sequence for each frame.
    typeParameters:
    - id: T
      description: >-
        The unmanaged sample type (for example, <xref href="System.Single" data-throw-if-not-resolved="false"></xref> or <xref href="System.Int16" data-throw-if-not-resolved="false"></xref>).  

        The size of <code class="typeparamref">T</code> must match the sample size of the current audio <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of frames successfully peeked (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
    content.vb: Public Function Peek(Of T As Structure)(data As T()) As AVResult32
