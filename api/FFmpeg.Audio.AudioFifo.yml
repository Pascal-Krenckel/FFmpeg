  assemblies:
  - FFmpeg
  namespace: FFmpeg.Audio
  summary: >-
    Peeks audio data into a single byte array starting at a specific sample offset,  

    without advancing the current read position.
  remarks: >-
    This method allows inspecting buffered audio starting at a specific position without consuming it.  

    It simply wraps <xref href="FFmpeg.Audio.AudioFifo.Peek(System.Span%7bSystem.Byte%7d%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> for convenience and reads interleaved (packed) samples directly into <code class="paramref">data</code>.
  example: []
  syntax:
    content: public AVResult32 Peek(byte[] data, int offset)
    parameters:
    - id: data
      type: System.Byte[]
      description: >-
        A writable byte array to receive interleaved audio samples.  

        The data layout depends on the audio <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref> and the number of <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref>.
    - id: offset
      type: System.Int32
      description: >-
        The sample offset (in frames) from which to start peeking.  

        A value of <code>0</code> peeks from the beginning of the available buffered data.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of bytes successfully peeked (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
    content.vb: Public Function Peek(data As Byte(), offset As Integer) As AVResult32
  overload: FFmpeg.Audio.AudioFifo.Peek*
  nameWithType.vb: AudioFifo.Peek(Byte(), Integer)
  fullName.vb: FFmpeg.Audio.AudioFifo.Peek(Byte(), Integer)
