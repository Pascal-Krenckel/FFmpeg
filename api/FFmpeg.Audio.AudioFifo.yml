        The data layout depends on the audio format (<xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>) and the number of <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref>.
