  summary: Peeks audio data into a single byte array without advancing the read position.
  remarks: >-
    This method allows inspecting audio data without consuming it.  

    It simply wraps <xref href="FFmpeg.Audio.AudioFifo.Peek(System.Span%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> for convenience and reads interleaved (packed) samples directly into <code class="paramref">data</code>.
