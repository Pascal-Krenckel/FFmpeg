    id: Read
    path: FFmpeg/Audio/AudioFifo.cs
    startLine: 1350
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Audio
  summary: Reads audio data from the <xref href="FFmpeg.Audio.AudioFifo" data-throw-if-not-resolved="false"></xref> buffer into an <xref href="FFmpeg.Utils.AVFrame" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    The <xref href="FFmpeg.Audio.AudioFifo" data-throw-if-not-resolved="false"></xref> stores all audio data according to the <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref> specified when the FIFO was created.  

    This method does not convert between sample types (e.g., float ↔ int16); doing so must be handled by the caller.

    </p>

    <p>

    Planar ↔ packed conversions are handled automatically:

    <ul><li>If the frame's format exactly matches the FIFO format, the data is read directly using <code>ffmpeg.av_audio_fifo_read</code>.</li><li>If the FIFO stores planar but the frame is packed, the data is converted from planar to packed using <xref href="FFmpeg.Audio.AudioFifo.ReadPlanarToPacked(System.Byte*%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.</li><li>If the FIFO stores packed but the frame is planar, the data is converted from packed to planar using <xref href="FFmpeg.Audio.AudioFifo.ReadPackedToPlanar(System.Byte**%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.</li></ul>

    </p>

    <p>

    To avoid unnecessary copying, it is recommended to provide frames in the same planar/packed layout as the FIFO’s <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: public AVResult32 Read(AVFrame frame)
    parameters:
    - id: frame
      type: FFmpeg.Utils.AVFrame
      description: >-
        The <xref href="FFmpeg.Utils.AVFrame" data-throw-if-not-resolved="false"></xref> to receive audio samples.  

        If the frame has no buffer, its channel layout, sample format, and sample count can be automatically initialized:

        <ul><li>If AVFrame.ChannelLayout.Channels is 0, it is set to the default layout for the FIFO’s <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref>.</li><li>If <xref href="FFmpeg.Utils.AVFrame.SampleFormat" data-throw-if-not-resolved="false"></xref> is <xref href="FFmpeg.Audio.SampleFormat.None" data-throw-if-not-resolved="false"></xref>, it is set to the FIFO’s <xref href="FFmpeg.Audio.AudioFifo.Format" data-throw-if-not-resolved="false"></xref>.</li><li>If <xref href="FFmpeg.Utils.AVFrame.SampleCount" data-throw-if-not-resolved="false"></xref> is less than 1, it is set to the current <xref href="FFmpeg.Audio.AudioFifo.Count" data-throw-if-not-resolved="false"></xref> (read all available samples).</li></ul>

        If the frame already has a buffer and any of these properties are unset, an exception is thrown.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of samples successfully read from the FIFO (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
    content.vb: Public Function Read(frame As AVFrame) As AVResult32
  overload: FFmpeg.Audio.AudioFifo.Read*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      Thrown if the frame already has a buffer allocated and some properties would need to be set,  

      or if, after initialization, the frame’s channel count or planar/packed layout does not match the FIFO.
