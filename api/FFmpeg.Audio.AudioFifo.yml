  assemblies:
  - FFmpeg
  namespace: FFmpeg.Audio
  summary: Peeks packed multi-channel audio data from the <xref href="FFmpeg.Audio.AudioFifo" data-throw-if-not-resolved="false"></xref> into a single contiguous buffer.
  remarks: >-
    The number of channels is determined from the current audio stream's <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref> property.  

    The total number of samples is calculated as <code>buffer.Length / Format.GetBytesPerSample()</code>.  

    Planar ↔ packed conversions are handled automatically:

    <ul><li>If the FIFO stores packed data, samples are peeked directly using <xref href="FFmpeg.Audio.AudioFifo.PeekPackedToPacked(System.Byte*%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.</li><li>If the FIFO stores planar data, samples are deinterleaved from planar into the packed buffer using <xref href="FFmpeg.Audio.AudioFifo.PeekPlanarToPacked(System.Byte*%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.</li></ul>
  example: []
  syntax:
    content: public AVResult32 Peek(Span<byte> buffer, int offset = 0)
    parameters:
    - id: buffer
      type: System.Span{System.Byte}
      description: >-
        A writable span to receive interleaved audio samples for all channels.  

        Samples are packed: one sample per channel in sequence for each audio sample.
    - id: offset
      type: System.Int32
      description: >-
        The sample offset from which to start peeking.  

        Each unit corresponds to one multi-channel sample (i.e., one sample per channel).
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of samples successfully peeked (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
    content.vb: Public Function Peek(buffer As Span(Of Byte), offset As Integer = 0) As AVResult32
  overload: FFmpeg.Audio.AudioFifo.Peek*
  nameWithType.vb: AudioFifo.Peek(Span(Of Byte), Integer)
  fullName.vb: FFmpeg.Audio.AudioFifo.Peek(System.Span(Of Byte), Integer)
