    path: FFmpeg/Audio/AudioFifo.cs
    startLine: 275
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Audio
  summary: Writes packed multi-channel audio data from a single contiguous buffer.
  remarks: >-
    The number of channels is determined from the current audio stream's <xref href="FFmpeg.Audio.AudioFifo.Channels" data-throw-if-not-resolved="false"></xref> property.  

    The total number of frames is calculated as <code>packedData.Length / (Channels × Format.GetBytesPerSample())</code>.
  example: []
  syntax:
    content: public AVResult32 Write(ReadOnlySpan<byte> packedData)
    parameters:
    - id: packedData
      type: System.ReadOnlySpan{System.Byte}
      description: >-
        A read-only span containing interleaved audio samples for all channels.  

        Samples are packed: one sample per channel in sequence for each frame.
    return:
      type: FFmpeg.Utils.AVResult32
      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of frames successfully written (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
    content.vb: Public Function Write(packedData As ReadOnlySpan(Of Byte)) As AVResult32
