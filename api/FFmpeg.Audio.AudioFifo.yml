      description: >-
        An <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> value representing either:

        <ul><li>The number of frames successfully peeked (if the operation succeeded).</li><li>An error code (if the operation failed).</li></ul>
