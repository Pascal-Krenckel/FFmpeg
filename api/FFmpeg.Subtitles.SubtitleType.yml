  namespace: FFmpeg.Subtitles
  summary: >-
    Plain text subtitle. The <xref href="FFmpeg.Subtitles.SubtitleRect.Text" data-throw-if-not-resolved="false"></xref> field is set by the decoder 

    and is considered authoritative. The <xref href="FFmpeg.Subtitles.SubtitleRect.ASS" data-throw-if-not-resolved="false"></xref> and 

    <xref href="FFmpeg.Subtitles.SubtitleRect.BitmapData" data-throw-if-not-resolved="false"></xref> fields may contain approximations of the subtitle.
  example: []
  syntax:
    content: Text = 2
    return:
      type: FFmpeg.Subtitles.SubtitleType
