    id: GetBufferCapacity
    path: FFmpeg/Utils/AVFrame.cs
    startLine: 30
  assemblies:
  - FFmpeg
  namespace: FFmpeg.Utils
  summary: >-
    Gets the capacity (in bytes) of the specified buffer index in the frame.  

    Returns 0 if the buffer is not set or the index is out of range.
  example: []
  syntax:
    content: public int GetBufferCapacity(int index)
    parameters:
    - id: index
      type: System.Int32
      description: >-
        The index of the buffer to retrieve.  

        Indices 0–7 refer to <code>buf</code>, and indices 8 and above refer to <code>extended_buf</code>.
    return:
      type: System.Int32
      description: The size of the buffer in bytes, or 0 if not available.
    content.vb: Public Function GetBufferCapacity(index As Integer) As Integer
