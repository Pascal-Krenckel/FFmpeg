  assemblies:
  - FFmpeg
  namespace: FFmpeg.Utils
  summary: >-
    Represents an interface for managing references to unmanaged objects that must be disposed,

    such as FFmpeg objects, without requiring the implementing struct to handle disposal directly.
  example: []
  syntax:
    content: 'public interface IReference<T> where T : class, IDisposable'
    typeParameters:
    - id: T
      description: The type of the referenced object, which must implement <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Interface IReference(Of T As {Class, IDisposable})
  nameWithType.vb: IReference(Of T)
  fullName.vb: FFmpeg.Utils.IReference(Of T)
  name.vb: IReference(Of T)
