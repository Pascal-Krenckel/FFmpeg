  namespace: FFmpeg.Collections
  summary: Releases all resources used by the <xref href="FFmpeg.Collections.AVBufferPool" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This method is called when the pool is no longer needed, either explicitly through a call to

    <xref href="FFmpeg.Collections.AVBufferPool.Dispose" data-throw-if-not-resolved="false"></xref> or implicitly via the finalizer. It calls FFmpeg's `av_buffer_pool_uninit`

    function to free the memory associated with the buffer pool.
