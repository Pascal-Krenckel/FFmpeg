  namespace: FFmpeg.Collections
  summary: Represents a pool of <xref href="FFmpeg.Collections.AVBuffer" data-throw-if-not-resolved="false"></xref> objects for efficient memory management.
  remarks: >-
    This class is a wrapper around the FFmpeg `AVBufferPool` structure, providing a mechanism to

    allocate and manage a pool of buffers. It implements <xref href="System.IDisposable" data-throw-if-not-resolved="false"></xref> to ensure that

    resources are properly released when the pool is no longer needed.
  example: []
  syntax:
