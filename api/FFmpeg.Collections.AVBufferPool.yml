  assemblies:
  - FFmpeg
  namespace: FFmpeg.Collections
  summary: Rents a buffer from the pool.
  remarks: >-
    This method retrieves a buffer from the pool using FFmpeg's `av_buffer_pool_get` function.

    The caller is responsible for managing the lifecycle of the returned buffer.
  example: []
  syntax:
    content: public AVBuffer Rent()
    return:
      type: FFmpeg.Collections.AVBuffer
      description: An <xref href="FFmpeg.Collections.AVBuffer" data-throw-if-not-resolved="false"></xref> instance representing the rented buffer.
