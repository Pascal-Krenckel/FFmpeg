  assemblies:
  - FFmpeg
  namespace: FFmpeg.Codecs.Video.LibSVTAV1
  summary: Specifies the metric used for tuning the encoding process to optimize quality or performance.
  remarks: >-
    The tuning metric determines how the encoder adjusts its settings to balance between different aspects of quality and performance.

    Valid values are:

    <ul><li><xref href="FFmpeg.Codecs.Video.LibSVTAV1.TuningMetric.VQ" data-throw-if-not-resolved="false"></xref> (0) - Visual Quality: Optimized for subjective visual quality.</li><li><xref href="FFmpeg.Codecs.Video.LibSVTAV1.TuningMetric.PSNR" data-throw-if-not-resolved="false"></xref> (1) - Peak Signal-to-Noise Ratio: Optimized for objective image quality measurement. This is the default metric.</li><li><xref href="FFmpeg.Codecs.Video.LibSVTAV1.TuningMetric.SSIM" data-throw-if-not-resolved="false"></xref> (2) - Structural Similarity Index: Optimized for perceived visual quality, measuring structural similarity between images.</li></ul>
  example: []
  syntax:
    content: public enum TuningMetric
    content.vb: Public Enum TuningMetric
