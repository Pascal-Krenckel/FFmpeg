  assemblies:
  - FFmpeg
  namespace: FFmpeg.Codecs.Video.LibSVTAV1
  summary: >-
    Gets or sets the GOP size in frames. 

    Accepts values from [-2 to (2^31)-1].

    <br />

    Special values:

    <ul><li>-2: Approximately 5 seconds (default)</li><li>-1: Infinite GOP size, only applicable in CRF mode</li><li>0: Equivalent to -1</li></ul>

    <br />

    In SvtAv1EncApp, you can append the 's' suffix to use seconds instead of frames.

    To set GOP size in seconds directly, use <xref href="FFmpeg.Codecs.Video.LibSVTAV1.GOPSettings.AsTimeSpan" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public int? Frames { readonly get; set; }
    parameters: []
    return:
      type: System.Nullable{System.Int32}
    content.vb: Public Property Frames As Integer?
