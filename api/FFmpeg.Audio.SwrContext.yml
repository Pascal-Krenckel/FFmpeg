    - id: dst
      type: System.IntPtr
      description: Pointer to the destination buffer.
    - id: outSamplesPerChannel
      type: System.Int32
      description: The number of output samples per channel that <code class="paramref">dst</code> can hold.
    return:
      type: FFmpeg.Utils.AVResult32
      description: On success, returns the number of output samples produced. On error, returns an <xref href="FFmpeg.Utils.AVResult32" data-throw-if-not-resolved="false"></xref> error code.
