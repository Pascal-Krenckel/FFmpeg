name: Documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Release
        run: dotnet restore FFmpeg/FFmpeg.csproj -p:Configuration=Release -p:TargetFramework=net10.0

      - name: Build Release
        run: dotnet build FFmpeg/FFmpeg.csproj -c Release -f net10.0 --no-restore