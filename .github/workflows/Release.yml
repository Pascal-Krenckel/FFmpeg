name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FFmpeg/FFmpeg.csproj -p:Configuration=Release

      - name: Build
        run: dotnet build FFmpeg/FFmpeg.csproj -c Release --no-restore

      - name: Create release archives
        shell: bash
        run: |
          mkdir -p release-assets

          for dir in FFmpeg/bin/Release/*/; do
            name="FFmpeg.$(basename "$dir")"

            (
              cd "$dir"
              zip -r "$GITHUB_WORKSPACE/release-assets/$name.zip" .
            )
          done

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Krenckel

      - name: Publish NuGet package
        run: |
          dotnet nuget push "FFmpeg/bin/Release/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish NuGet symbols
        run: |
          dotnet nuget push "FFmpeg/bin/Release/*.snupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}" \
            release-assets/*.zip